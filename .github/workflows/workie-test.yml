# Auto-generated by workie -- do not edit manually.

name: test
on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - build-info/**
      - esbuild-plugin-build-info/**
      - gosub/src/**
      - gosub/test/**
      - gosub/website/**
      - remark-bundle/**
      - rollup-plugin-build-info/**
      - runfig/**
      - static-file-bundle/**
      - utf64/go/**
      - utf64/js/**
      - utf64/py/**
      - utf64/rust/**
      - utf64/website/**
      - workie/**
jobs:
  test:
    name: test packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: workie affected
        id: workie
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          changes() {
            case "$GITHUB_EVENT_NAME" in
              pull_request)
                git cat-file -e "$GITHUB_SHA^1" 2>/dev/null ||
                  git fetch --quiet --no-tags --depth=2 origin "$GITHUB_SHA" || return
                git diff --name-only "$GITHUB_SHA^1" "$GITHUB_SHA" ;;
              push)
                [[ ! "$BEFORE" =~ ^0*$ ]] || return
                { git cat-file -e "$BEFORE^{commit}" && git cat-file -e "$GITHUB_SHA^{commit}"; } 2>/dev/null ||
                  git fetch --quiet --no-tags --depth=1 origin "$BEFORE" "$GITHUB_SHA" || return
                git diff --name-only "$BEFORE" "$GITHUB_SHA" ;;
              *) return 1 ;;
            esac
          }
          if files=$(changes) && ! grep -qE '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json)$' <<< "$files"; then
            hit() { grep -qE -- "$1" <<< "$files"; }
          else
            echo "Running every package ($GITHUB_EVENT_NAME)"
            hit() { true; }
          fi
          roots=""
          filter=""
          if hit '^(build-info/.*)$'; then roots+=' @moreplease/build-info'; filter+=' --filter=@moreplease/build-info'; fi
          if hit '^(esbuild-plugin-build-info/.*)$'; then roots+=' @moreplease/esbuild-plugin-build-info'; filter+=' --filter=@moreplease/esbuild-plugin-build-info'; fi
          if hit '^(gosub/test/.*)$'; then roots+=' gosub.test'; filter+=' --filter=gosub.test'; fi
          if hit '^(gosub/src/.*|gosub/website/.*|rollup-plugin-build-info/.*|utf64/js/.*)$'; then roots+=' gosub.website'; filter+=' --filter=gosub.website'; fi
          if hit '^(remark-bundle/.*)$'; then roots+=' @moreplease/remark-bundle'; filter+=' --filter=@moreplease/remark-bundle'; fi
          if hit '^(runfig/.*)$'; then roots+=' runfig'; filter+=' --filter=runfig'; fi
          if hit '^(static-file-bundle/.*)$'; then roots+=' @moreplease/static-file-bundle'; filter+=' --filter=@moreplease/static-file-bundle'; fi
          if hit '^(utf64/go/.*)$'; then roots+=' utf64.go'; filter+=' --filter=utf64.go'; fi
          if hit '^(utf64/py/.*)$'; then roots+=' utf64.py'; filter+=' --filter=utf64.py'; fi
          if hit '^(utf64/rust/.*)$'; then roots+=' utf64.rust'; filter+=' --filter=utf64.rust'; fi
          if hit '^(gosub/src/.*|rollup-plugin-build-info/.*|utf64/js/.*|utf64/website/.*)$'; then roots+=' utf64.website'; filter+=' --filter=utf64.website'; fi
          if hit '^(workie/.*)$'; then roots+=' @moreplease/workie'; filter+=' --filter=@moreplease/workie'; fi
          echo "Affected:${roots:- none}"
          echo "roots=${roots# }" >> "$GITHUB_OUTPUT"
          echo "filter=${filter# }" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version-file: utf64/go/go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: turbo test
        if: steps.workie.outputs.filter != ''
        run: pnpm exec turbo test ${{ steps.workie.outputs.filter }} --log-order=stream
        env: {}
